<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Sphere Ocean Gradient -->
    <radialGradient id="oceanGrad" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#0284C7" />
      <stop offset="85%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#075985" />
    </radialGradient>

    <!-- Glossy Highlight for 3D Glass Look -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Clip path to keep continents and grid inside the globe -->
    <clipPath id="globeClip">
      <circle cx="32" cy="32" r="29.5" />
    </clipPath>
  </defs>

  <!-- Outer Shadow & Base Sphere (Ocean) -->
  <circle cx="32" cy="32" r="30" fill="#0369A1" opacity="0.2" />
  <circle cx="32" cy="32" r="29.5" fill="url(#oceanGrad)" stroke="#0284C7" stroke-width="0.75" />

  <!-- Clipped World Features (Americas View - Apple/Standard Emoji Style) -->
  <g clip-path="url(#globeClip)">
    
    <!-- Continents Layer -->
    <g fill="#22C55E" stroke="#15803D" stroke-width="0.5" stroke-linejoin="round">
      
      <!-- North America & Greenland -->
      <path d="M 24 6 
               C 27 6, 29 8, 30 11 
               C 32 10, 35 7, 39 8 
               C 42 9, 39 12, 36 13 
               C 34 16, 38 18, 32 24 
               C 28 27, 26 23, 23 26 
               C 22 28, 25 31, 27 34 
               C 24 35, 23 33, 22 30 
               C 20 28, 19 23, 21 21 
               C 20 18, 17 19, 16 16 
               C 15 13, 19 8, 24 6 Z" />
               
      <!-- Greenland (Ice cap accent) -->
      <path d="M 32 7 C 36 6, 39 8, 37 12 C 34 12, 31 10, 32 7 Z" fill="#E2E8F0" stroke="#94A3B8" />

      <!-- South America -->
      <path d="M 27 35 
               C 31 35, 36 37, 39 42 
               C 41 46, 36 53, 32 58 
               C 30 58, 29 52, 28 48 
               C 27 44, 25 41, 27 35 Z" />

      <!-- Caribbean Islands -->
      <circle cx="28" cy="31" r="0.8" fill="#22C55E" />
      <circle cx="31" cy="32" r="0.7" fill="#22C55E" />

      <!-- Edge of Western Europe / Africa (Right side peek) -->
      <path d="M 52 14 C 55 16, 58 20, 59 25 C 56 26, 54 22, 52 14 Z" />
      <path d="M 54 30 C 58 32, 59 38, 57 45 C 55 42, 53 36, 54 30 Z" />
    </g>

    <!-- Grid Lines (Latitude & Longitude) -->
    <g stroke="#E0F2FE" stroke-width="0.6" opacity="0.45" fill="none">
      <!-- Equator & Latitudes -->
      <ellipse cx="32" cy="32" rx="29.5" ry="7" />
      <ellipse cx="32" cy="18" rx="26" ry="5.5" />
      <ellipse cx="32" cy="46" rx="26" ry="5.5" />

      <!-- Prime Meridian & Longitudes -->
      <ellipse cx="32" cy="32" rx="12" ry="29.5" />
      <ellipse cx="32" cy="32" rx="22" ry="29.5" />
      <line x1="32" y1="2.5" x2="32" y2="61.5" />
    </g>

    <!-- Glossy Curved Reflection -->
    <path d="M 5 32 A 27 27 0 0 1 59 32 A 29.5 29.5 0 0 0 5 32 Z" fill="url(#glossGrad)" />
  </g>

  <!-- Outer Ring Rim -->
  <circle cx="32" cy="32" r="29.5" fill="none" stroke="#0284C7" stroke-width="1" opacity="0.6" />
</svg>
